name: build

# Husk's CI. Two jobs with very different costs:
#
#   validate  ~1 min, no dependencies. Runs on every PR. Checks the things that
#             have actually gone wrong in this repo: a source file missing from
#             the target, a deployment target drifting, a native library sitting
#             ABOVE the app (dyld then refuses to load it at launch).
#
#   build     Hours. Runs on push to main, on tags, and on demand. Needs no
#             signing identity: package_ipa.sh builds with CODE_SIGNING_ALLOWED=NO
#             and ad-hoc signs with Husk's entitlements, which TrollStore keeps
#             and a sideloader replaces.
#
# There is deliberately no PR trigger on `build`. A cold run fetches WebKit for
# ANGLE (~260 MB), builds QEMU, MoltenVK with SPIRV-Cross and SPIRV-Tools, and
# the Rust pairing library, then cross-compiles the app. That is not something to
# spend on every pull request.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runner-image:
        # Two valid pairs, and they are not interchangeable:
        #
        #   macos-26 + Xcode 26.x  the 15.0 configuration. Xcode 26 cannot be
        #                           installed on a host below macOS 26.2, so no
        #                           other image will do.
        #   macos-14 + Xcode 15.4  the iOS 14 experiment (IOS14-EXPERIMENT.md).
        #                           An iOS 14 deployment target needs the iOS
        #                           17.5 SDK, which only Xcode 15.x ships, and
        #                           Xcode 15.x runs on Sonoma and nothing newer.
        #
        # macos-14 is unsupported by GitHub from 2026-11-02.
        description: "Runner image. Must match the Xcode below"
        type: choice
        default: macos-26
        options: [macos-26, macos-15, macos-14]
      xcode-version:
        description: "Xcode version. Pinned, not latest-stable, so CI stays reproducible. Use 15.4 for the iOS 14 experiment."
        type: string
        default: "26.6"
      # The iOS 14 experiment needs three inputs set together: macos-14,
      # xcode-version 15.4, and clang15-patches yes. These three are the whole
      # experiment; the defaults are the working 15.0 build.
      clang15-patches:
        description: "Patch 2026 third-party source for Apple clang 15 -- ANGLE's ResourceMap.h static_assert, and virglrenderer's label-before-declaration. One switch for both; see build_angle_ios.sh and build_gpu_ios.sh"
        type: choice
        default: "no"
        options: ["no", "yes"]
      webkit-commit:
        description: "Pin WebKit to this commit instead of tracking main. Only needed if the ANGLE patch does not get past the build; a 2024-era sha works because the feature does not exist there"
        type: string
        default: ""
      cache:
        description: "Use the dependency caches"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- validate
  # Fast, dependency-free, and aimed squarely at this repo's recurring failures.
  # It needs an arm64 image only because both jobs live in this one file; it
  # touches no iOS SDK.
  validate:
    name: validate project and iOS 15 floor
    runs-on: macos-15
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: install xcodegen
        run: brew install xcodegen

      - name: regenerate the project from project.yml
        # project.yml is the source of truth; the checked-in .pbxproj is a build
        # artefact of it. Regenerating here is what package_ipa.sh does too, so a
        # stale artefact cannot pass review.
        run: cd src/app && xcodegen generate

      - name: assert the project is openable by the oldest Xcode we target
        # Xcode cannot open a project written in a format newer than it knows.
        # XcodeGen defaults to projectFormat xcode16_0, which emits objectVersion
        # 77 plus a preferredProjectObjectVersion attribute; Xcode 15.4 refuses
        # it outright and says so:
        #
        #   Unable to read project 'Husk.xcodeproj' ... it is in a future Xcode
        #   project file format (77). Adjust the project format using a
        #   compatible version of Xcode to allow it to be opened by this one.
        #
        # project.yml pins projectFormat: xcode15_3, and this asserts the pin
        # actually took effect. It runs after the regeneration above, so it reads
        # what the build will really use rather than the checked-in artefact.
        run: |
          set -euo pipefail
          ver="$(grep -m1 -oE 'objectVersion = [0-9]+' src/app/Husk.xcodeproj/project.pbxproj \
                 | grep -oE '[0-9]+')"
          echo "regenerated project objectVersion: $ver"
          if [ -z "$ver" ]; then
            echo "::error::could not read objectVersion out of the regenerated project"
            exit 1
          fi
          if [ "$ver" -gt 63 ]; then
            echo "::error::objectVersion $ver is unreadable by Xcode 15.4 (max 63). Check the projectFormat option in project.yml."
            exit 1
          fi
          if grep -q 'preferredProjectObjectVersion' src/app/Husk.xcodeproj/project.pbxproj; then
            echo "::error::the project still carries preferredProjectObjectVersion, which only the xcode16_* formats emit"
            exit 1
          fi
          echo "ok: objectVersion $ver, readable by Xcode 15.3 and later"

      - name: assert every source file is in the target
        # The failure this guards is silent and confusing: a .swift file that
        # exists on disk but not in the target gives "cannot find 'X' in scope"
        # for a type that is plainly right there. project.yml globs the
        # directories, so a file is only absent when the checked-in .pbxproj is
        # out of date -- which is what happens whenever xcodegen is missing.
        run: |
          set -euo pipefail
          missing=0
          for f in src/app/Husk/*.swift src/app/Husk/Play/*.swift \
                   src/app/Shared/*.swift src/app/HuskDownloadsWidget/*.swift \
                   src/app/HuskJITHelper/HuskJITMessages.swift; do
            base="$(basename "$f")"
            if ! grep -q "$base" src/app/Husk.xcodeproj/project.pbxproj; then
              echo "::error file=$f::not present in project.pbxproj; the target will not compile it"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "ok: every Swift source is in the target"

      - name: assert the deployment targets
        run: |
          set -euo pipefail
          # The app's floor is the `iOS:` line under the top-level
          # `deploymentTarget:` in `options:`. The extensions use a four-space
          # `deploymentTarget: "..."`, so anchoring on exactly two spaces cannot
          # pick one of theirs up.
          #
          # The `grep -v` is load-bearing. That block opens with a long comment
          # which quotes `iOS: "15.0"` while explaining how to revert, and a
          # plain `grep -m1` matches the comment rather than the setting four
          # lines below it. For one commit this step therefore compared 15.0
          # against 15.0 and passed while the file said 14.0 -- the guard was
          # checking nothing at all. Strip comments before reading the value.
          app="$(grep -A20 '^  deploymentTarget:' src/app/project.yml \
                 | grep -vE '^[[:space:]]*#' \
                 | grep -m1 -oE 'iOS: "[0-9.]+"' \
                 | grep -oE '[0-9.]+')"
          echo "app target floor: $app"
          if [ -z "$app" ]; then
            echo "::error::could not read the app's iOS floor from project.yml"
            exit 1
          fi
          case "$app" in
            15.0) ;;
            14.0) echo "::warning::building the experimental iOS 14 configuration; see IOS14-EXPERIMENT.md" ;;
            *) echo "::error::project.yml floor is '$app'; expected 15.0, or 14.0 for the iOS 14 experiment"; exit 1 ;;
          esac

          # HuskJITHelper's 26.0 floor is only meaningful when the target exists.
          # The iOS 14 configuration drops it: no Xcode ships both an iOS 17.5
          # SDK and a 26.0 deployment target. Asserting it unconditionally made
          # every pull request red.
          if grep -qE '^  HuskJITHelper:$' src/app/project.yml; then
            grep -q 'deploymentTarget: "26.0"' src/app/project.yml \
              || { echo "::error::HuskJITHelper must keep its 26.0 floor"; exit 1; }
          else
            echo "note: HuskJITHelper is absent, so its 26.0 floor is not asserted"
          fi

          # The widget is present in both configurations and stays at 16.1: it is
          # a Live Activity, and pluginkit simply never registers it below 16.1.
          grep -q 'deploymentTarget: "16.1"' src/app/project.yml \
            || { echo "::error::HuskDownloadsWidget must keep its 16.1 floor"; exit 1; }
          if ! grep -q "IPHONEOS_DEPLOYMENT_TARGET = $app;" src/app/Husk.xcodeproj/project.pbxproj; then
            echo "::warning::the checked-in .pbxproj does not match project.yml. package_ipa.sh regenerates it when xcodegen is installed, so this is a warning rather than a failure."
          fi
          echo "ok: floors agree"

      - name: assert no embedded native sits above the app
        # dyld refuses to load a dylib whose LC_BUILD_VERSION minos exceeds the
        # running OS. An ANGLE or QEMU built above the app's floor is a silent
        # launch-time failure, invisible until someone runs the IPA on the
        # oldest supported version. This is the most breakable invariant in
        # both ports, so it is a build-time check.
        #
        # This compares each script's floor against the app's floor rather than
        # against a literal 15.0. The literal version had a hole exactly at
        # iOS 14: it asked "is anything above 15.1?", so a library left behind
        # at 15.0 -- just as fatal to a 14.0 app -- sailed through.
        run: |
          set -euo pipefail
          app="$(grep -A20 '^  deploymentTarget:' src/app/project.yml \
                 | grep -vE '^[[:space:]]*#' \
                 | grep -m1 -oE 'iOS: "[0-9.]+"' \
                 | grep -oE '[0-9.]+')"
          # numeric <=, so 9.0 < 14.0 rather than "9" > "1" lexically
          le() { awk -v a="$1" -v b="$2" 'BEGIN { exit !(a + 0 <= b + 0) }'; }
          bad=0
          check() {
            got="$(grep -oE "$2" "scripts/$1" 2>/dev/null | head -1 \
                  | grep -oE '[0-9]+\.[0-9]+' | head -1 || true)"
            if [ -z "$got" ]; then
              echo "::warning::no deployment target readable in scripts/$1; not checked"
            elif le "$got" "$app"; then
              echo "ok: $3 targets $got, at or below the app's $app"
            else
              echo "::error file=scripts/$1::$3 targets $got, above the app's $app floor"
              bad=1
            fi
          }
          # REMOVED: the QEMU entry in the list above. build_ios.sh still exists
          # and still declares SDKMINVER at 14.0, so the guard still reads it --
          # it just no longer asserts that QEMU is one of the things built.
          check build_angle_ios.sh     'IPHONEOS_DEPLOYMENT_TARGET="?[0-9]+\.[0-9]+'  "ANGLE"
          check build_rppairing_ios.sh 'IPHONEOS_DEPLOYMENT_TARGET="?[0-9]+\.[0-9]+'  "rppairing"
          if [ "$bad" -ne 0 ]; then
            echo "raise them together with project.yml, or not at all"
            exit 1
          fi

      - name: assert no iOS 16/17-only API crept back in
        # The app deploys to 15.0 and Compat15.swift is the only file allowed to
        # name these. Anything else fails to compile; catching it here gives a
        # readable message instead of an availability error inside Xcode -- and
        # it costs a minute instead of the two hours it takes to reach the app
        # target.
        #
        # The list grew twice. The first pass caught the whole SwiftUI family
        # (NavigationStack, LabeledContent, ShareLink, the detents, the .snappy
        # animations, the value-based .animation). The build then found a second
        # batch that a pattern search had walked straight past, because none of
        # them share a name with the first: .bold(), Color.gradient,
        # .scrollIndicators, .scrollDismissesKeyboard, .defersSystemGestures,
        # Locale.region, and two UIKit calls in HuskOrientation. A list like
        # this only catches what somebody thought to add to it, so it is worth
        # growing rather than trusting.
        run: |
          set -euo pipefail
          pat='NavigationStack|NavigationLink\(value:|navigationDestination|NavigationView\(path:'
          pat+='|ShareLink\(item:|\.presentationDetents|\.presentationDragIndicator'
          pat+='|persistentSystemOverlays|\.snappy\b|\.animation\(.+, value:'
          pat+='|\.toolbar\(\.(hidden|visible), for:|\bLabeledContent\b'
          pat+='|\.gradient\b|\.scrollIndicators|\.scrollDismissesKeyboard'
          pat+='|\.defersSystemGestures|Locale\.current\.region|\.region\?'
          pat+='|setNeedsUpdateOfSupportedInterfaceOrientations|requestGeometryUpdate'
          # The iOS 13 floor (IOS14-EXPERIMENT.md now covers 13 too): the shims
          # stand in for these as well.
          pat+='|\.foregroundStyle\(|Color\(uiColor:|\.background\([^)]*, *in:'
          pat+='|buttonStyle\(\.bordered|\.buttonBorderShape\(|\.controlSize\('
          pat+='|\.symbolRenderingMode\(|\.overlay\(alignment:|\.task *[\{\(]'
          pat+='|\.safeAreaInset\(|\.onSubmit\b|\.submitLabel\(|\.refreshable\b'
          pat+='|\bAnyShapeStyle\b'
          # iOS 13 floor: the whole of the iOS 14 surface, by type and by member.
          # Every one of these is a *rename at the call site* rather than a shim
          # an extension can provide, because each is SwiftUI's own type name and
          # an extension cannot shadow it. huskLabel/ huskProgress/ huskOnChange/
          # huskIgnoresSafeArea/ huskLazyVStack/ huskAppStorage are deliberately
          # NOT matched: grep -E has no lookbehind, but it does not need one,
          # because \bLabel does not match inside huskLabel -- `k` and `L` are
          # both word characters, so there is no boundary between them. That is
          # the property the first version of this list relied on without
          # knowing, and it is checked here rather than assumed.
          pat+='|\bLabel *[\(\{]|\bProgressView\b|@AppStorage\b|\bStateObject\b'
          pat+='|\.onChange\(|\.ignoresSafeArea\b|\bLazyVStack\b|\bScrollViewReader\b'
          pat+='|\bTextEditor\b|\bColorPicker\b|\bscenePhase\b|\.onOpenURL\b'
          pat+='|\bList *[\(\{]|\.listStyle\(|\.listRow(Insets|Background|Separator)\b'
          pat+='|\.onDelete\b|\.onMove\b|\.swipeActions\b'
          # iOS 14 lifecycle. App, WindowGroup and @UIApplicationDelegateAdaptor
          # all begin at 14; on 13 the entry point is a UIWindow and a
          # UIHostingController created by the delegate.
          pat+='|\bWindowGroup\b|@UIApplicationDelegateAdaptor|struct +\w+ *: *App\b'
          # iOS 16, found in the code while doing the 13 sweep: DisclosureGroup
          # was used once, unguarded, with no shim -- and the list had no entry
          # for it, so nothing had ever complained. If that line really is iOS 16
          # then a 14.0 build should not have compiled; CI decides that. If it
          # is not, the rule costs one comment.
          pat+='|\bDisclosureGroup\b'
          hits="$(grep -rnE "$pat" src/app --include='*.swift' --exclude=Compat15.swift --exclude=Compat14.swift --exclude=Compat13.swift \
                   | grep -vE '^[^:]+:[0-9]+: *//' || true)"

          # `.bold()` and `.fontWeight(_:)` are checked separately because two
          # different things answer to each: `Font.bold()` and
          # `Font.fontWeight(_:)` have been there since iOS 13, while
          # `View.bold()` and `View.fontWeight(_:)` are iOS 16. Matching either
          # name on its own catches the Font spelling too --
          # `.font(.caption.bold())` in SettingsTab -- so a line that is inside a
          # `.font(` is not flagged.
          #
          # Note the asymmetric parens, which are not a typo. `View.bold()` takes
          # no argument, so `\.bold\(\)` is the whole shape; `fontWeight` always
          # takes one, so `\.fontWeight\(\)` would match nothing at all. The
          # first version of this line got it wrong and would have missed the
          # very call it was added for.
          #
          # Both are here because this check wrote them in: the first pass
          # replaced an iOS 16 `.bold()` with `.fontWeight(.bold)`, which is also
          # iOS 16. A guard only helps if it is checked against the change it is
          # supposed to be guarding.
          bold="$(grep -rnE '\.bold\(\)|\.fontWeight\(' src/app --include='*.swift' --exclude=Compat15.swift \
                   | grep -vE '\.font\(' | grep -vE '^[^:]+:[0-9]+: *//' || true)"

          if [ -n "$hits" ] || [ -n "$bold" ]; then
            echo "$hits"
            echo "$bold"
            echo "::error::iOS 16/17-only API used outside Compat15.swift; use the shim instead"
            exit 1
          fi
          echo "ok: no iOS 16/17-only APIs outside the shim"

      - name: assert every C symbol Swift calls is defined
        # The one thing a compile cannot tell you. A C declaration with no
        # definition satisfies every Swift call site, so the app builds, links
        # fail, and the error names no file -- a page of "Undefined symbols for
        # architecture arm64" with nothing to grep for. Four builds were spent
        # learning this: three audits passed first, and all three asked whether
        # a symbol was *declared*, which is not the question the linker asks.
        #
        # It happened because QemuAbsent.c held 33 definitions, 7 of them
        # husk_ios_jit_* that the VM removal left declared and called while
        # deleting the file that defined them.
        #
        # Here because it costs a second and saves the two hours it takes to
        # reach the app target. The source list is derived from project.yml, so
        # it cannot go stale the way a hardcoded list did -- the first version of
        # this check named two directories and could not see JitAbsent.c, which
        # was the answer, and reported the eight symbols it had just defined as
        # missing.
        run: |
          set -euo pipefail
          python3 tests/test_link_symbols.py

      - name: assert every layer above the tab UI declares its hit-testing policy
        # The app once built, ran, drew every screen -- and answered nothing.
        # Not a tab, not a button, not a scroll. The cause was AppWindowLayer: a
        # GeometryReader spanning the screen, sitting over the TabView in the
        # root ZStack, with no .allowsHitTesting. A view that occupies the screen
        # and draws nothing still absorbs the touches meant for what is beneath
        # it, and nothing in the source suggests that.
        #
        # Upstream knew: `.allowsHitTesting(showGuestScreen)` on AppWindowLayer,
        # the same idiom on GuestScreenView. Removing QEMU removed showGuestScreen,
        # and the modifier naming it went with it -- silently, because the line it
        # guarded was still valid Swift.
        #
        # The guard now lives inside AppWindowLayer, so the check reads either
        # route: a policy at the call site, or one in the layer's own type.
        run: |
          set -euo pipefail
          python3 tests/test_hit_testing_policy.py

      - name: prove that check still catches what it exists for
        # A gate that has only ever run against a correct tree has not been
        # shown to fail on an incorrect one. This removes JitAbsent.c, watches
        # the check name all eight symbols, and puts the file back.
        run: |
          set -euo pipefail
          python3 tests/test_link_symbol_catches_defect.py

  # ------------------------------------------------------------------- build
  build:
    name: build IPA and tipa
    runs-on: ${{ inputs['runner-image'] || github.event.inputs['runner-image'] || 'macos-26' }}
    # 6 hours is the hard ceiling on a macOS runner. A cold build is long but
    # comfortably inside it; raise this only if the cache is being ignored.
    timeout-minutes: 355
    if: github.event_name != 'pull_request'

    # Job level, not on the build step: the preflight reads both of these to
    # reject a configuration that is guaranteed to fail, and it runs long before
    # the build step. ci_build.sh calls build_angle_ios.sh as a child, so these
    # reach the script without it having to do anything.
    env:
      HUSK_CLANG15_PATCHES: ${{ inputs['clang15-patches'] == 'yes' && '1' || '0' }}
      WEBKIT_COMMIT: ${{ inputs['webkit-commit'] || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # package_ipa.sh stamps the commit into the bundle

      - name: select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs['xcode-version'] || github.event.inputs['xcode-version'] || '26.6' }}

      - name: preflight
        run: |
          set -euo pipefail

          # What did this run actually get, and where did it come from? The
          # dispatch inputs only exist for workflow_dispatch and workflow_call.
          # On a push or a release, `inputs` is an empty object and
          # github.event.inputs is empty too, so the expressions fall through to
          # their defaults and the job quietly builds the 15.0 configuration on
          # macos-26 with Xcode 26.6 -- no matter what is in the workflow file.
          # That is the usual reason a hand-edited runner-image looks ignored.
          event="${{ github.event_name }}"
          echo "::notice::trigger=$event"
          echo "::notice::inputs.runner-image='${{ inputs['runner-image'] }}'  github.event.inputs.runner-image='${{ github.event.inputs['runner-image'] }}'"
          echo "::notice::inputs.xcode-version='${{ inputs['xcode-version'] }}'  github.event.inputs.xcode-version='${{ github.event.inputs['xcode-version'] }}'"
          echo "::notice::HUSK_CLANG15_PATCHES=${HUSK_CLANG15_PATCHES:-unset}  WEBKIT_COMMIT=${WEBKIT_COMMIT:-unset}"
          if [ "$event" != "workflow_dispatch" ]; then
            echo "::warning::this is a '$event' run, so the workflow_dispatch inputs are empty and the runner and Xcode fell back to their defaults. Use the 'Run workflow' button to choose a runner image."
          fi

          echo "== runner ==";  uname -m; sw_vers
          echo "== xcode ==";   xcodebuild -version
          echo "== sdks ==";    xcodebuild -showsdks | grep -i iphoneos || true
          echo "== host ==";    python3 --version; git --version
          echo "== disk ==";    df -h /

          # scripts/build_gpu_ios.sh hardcodes /opt/homebrew/bin/{meson,ninja},
          # which is the Apple Silicon Homebrew prefix. An Intel runner has no
          # such path and the job fails deep inside a meson error.
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::not an Apple Silicon runner; build_gpu_ios.sh needs arm64 Homebrew at /opt/homebrew"
            exit 1
          fi

          # Xcode 26 requires macOS Tahoe 26.2 or later, and says so only when
          # it is asked to resolve a destination:
          #   { platform:macOS, arch:arm64e, variant:Mac Catalyst, name:My Mac,
          #     error:Xcode doesn't support My Mac's macOS 15.7.9 }
          # The stages that only shell out to clang survive that; build_angle_ios.sh
          # drives `xcodebuild archive`, which does not, and the run dies in ANGLE
          # with four thread-safety errors that have nothing to do with the real
          # cause. Catch it here instead.
          #
          # The requirement comes from the selected Xcode, not from a literal.
          # The iOS 14 configuration needs the opposite end of the table --
          # Xcode 15.x on Sonoma -- and a hardcoded 26.2 rejected it.
          xc_major="$(xcodebuild -version | head -1 | grep -oE '[0-9]+' | head -1)"
          echo "Xcode major: $xc_major"
          host_major="$(sw_vers -productVersion | cut -d. -f1)"
          host_minor="$(sw_vers -productVersion | cut -d. -f2)"
          if   [ "$xc_major" -ge 26 ]; then need_major=26; need_minor=2
          elif [ "$xc_major" -ge 16 ]; then need_major=14; need_minor=5
          else                                need_major=13; need_minor=5
          fi
          if [ "$host_major" -lt "$need_major" ] \
             || { [ "$host_major" -eq "$need_major" ] && [ "$host_minor" -lt "$need_minor" ]; }; then
            echo "::error::Xcode $xc_major needs macOS $need_major.$need_minor or later; this host is $(sw_vers -productVersion). Pick a matching runner-image via workflow_dispatch."
            exit 1
          fi

          # The app's floor has to be one this Xcode can even express. Xcode 16
          # raised the minimum deployment target to iOS 15, so an iOS 14 floor
          # needs Xcode 15.x specifically -- 16 through 26 all reject it. Saying
          # so here beats reading 300 availability errors out of the app target.
          app_floor="$(grep -A20 '^  deploymentTarget:' src/app/project.yml \
                      | grep -vE '^[[:space:]]*#' \
                      | grep -m1 -oE 'iOS: "[0-9.]+"' | grep -oE '[0-9.]+' || true)"
          echo "app deployment floor: $app_floor"
          if [ -n "$app_floor" ] && awk -v a="$app_floor" 'BEGIN { exit !(a + 0 < 15) }'; then
            if [ "$xc_major" -ge 16 ]; then
              echo "::error::project.yml targets iOS $app_floor, but Xcode $xc_major refuses any deployment target below iOS 15. Use Xcode 15.x (15.4) on the macos-14 image."
              exit 1
            fi
            echo "::warning::iOS $app_floor floor needs a 2024-era WEBKIT_COMMIT for ANGLE; see IOS14-EXPERIMENT.md section 3"
          fi

          # Two separate incompatibilities bite on Xcode 15.x, one per dependency, and
          # both are "2026 source, 2024 clang":
          #
          #   ANGLE   ResourceMap.h:463 static_assert(kNeedsLock) -- a clang bug
          #           that diagnoses a static_assert inside a discarded
          #           `if constexpr` branch.
          #   virgl   vrend_renderer.c:13026 -- a label followed by a
          #           declaration, which is C23 (WG14 N2508) and invalid C17,
          #           so clang 15 rejects it at -std=gnu11.
          #
          # Unpatched and unpinned, each is a hard build failure an hour or two
          # into the job. Catch them here instead.
          if [ "$xc_major" -le 15 ] \
             && [ "${HUSK_CLANG15_PATCHES:-0}" = "0" ] \
             && [ -z "${WEBKIT_COMMIT:-}" ]; then
            echo "::error::Xcode $xc_major cannot build this tree's third-party sources (ANGLE's ResourceMap.h static_assert; virglrenderer's label-before-declaration). Re-run with clang15-patches=yes."
            exit 1
          fi

          # HuskJITHelper's deployment target is 26.0, and Xcode refuses a
          # deployment target above the installed SDK. Fail here, with the
          # reason, rather than with an opaque error deep in the build log.
          # The target does not exist in the iOS 14 configuration, where the
          # 17.5 SDK could not satisfy it, so only enforce it when it is there.
          if grep -qE '^  HuskJITHelper:$' src/app/project.yml; then
            sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
            echo "iphoneos SDK: $sdk"
            major="${sdk%%.*}"
            if [ "$major" -lt 26 ]; then
              echo "::error::iOS SDK $sdk is too old. HuskJITHelper has a 26.0 deployment target (Built-in StikJIT). Pick a newer Xcode via workflow_dispatch."
              exit 1
            fi
          else
            echo "note: HuskJITHelper is absent, so no 26.0 SDK is required"
          fi

          free_gb="$(df -g / | awk 'NR==2 {print $4}')"
          if [ "${free_gb:-0}" -lt 30 ]; then
            echo "::warning::only ${free_gb}GB free on /. A cold build writes WebKit, QEMU, MoltenVK and DerivedData."
          fi

      - name: install build tools
        run: |
          set -euo pipefail
          # meson and ninja for the virglrenderer cross build, pkg-config for
          # its .pc files, xcodegen to regenerate the project from project.yml.
          #
          # qemu is back, but only for qemu-img: it was removed when the VM went,
          # because the only thing needing qemu-img was the pre-build phase that
          # made the VM's two blank disk seeds. Those are gone, and qemu-img is
          # needed again for an unrelated reason -- converting the Lineage guest
          # image to raw so its system partition can be unpacked for the
          # translation layer's CA certificates, fonts and Java runtime.
          #
          # e2fsprogs is for debugfs, which reads that partition. Homebrew
          # installs it keg-only, so sbin never joins PATH on its own and a bare
          # `debugfs` does not resolve -- it has to be put there explicitly.
          # openjdk is for src/java-framework/build.sh, which compiles and dexes
          # Husk's Java framework.
          brew install meson ninja pkg-config xcodegen qemu e2fsprogs openjdk

          # Both prefixes, because which one exists depends on the runner's
          # architecture. Only the one that exists gets written.
          for p in /opt/homebrew/opt/e2fsprogs/sbin /usr/local/opt/e2fsprogs/sbin; do
            [ -d "$p" ] && echo "$p" >> "$GITHUB_PATH"
          done
          # Not a bare `command -v debugfs`: $GITHUB_PATH only affects later
          # steps, so it cannot resolve in this one. And it needs the `||`
          # because this block runs under `set -e`, where an unresolved lookup
          # would fail the step for no reason.
          command -v debugfs || ls -l /opt/homebrew/opt/e2fsprogs/sbin/debugfs

      - name: install the Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios
          rustc --version

      - name: read the app deployment floor
        # The sysroot holds libANGLE, libqemu and MoltenVK, each stamped with its
        # own LC_BUILD_VERSION minos. Caching them across a floor change would
        # hand a 14.0 build a 15.0 sysroot and defeat, silently, the invariant
        # the validate job exists to check. So the floor is part of the key --
        # and so is the WebKit commit and the ANGLE patch flag, because those
        # change the bytes of libANGLE-shared.dylib itself. A cache hit across
        # them would restore a dylib built from a different source tree.
        id: floor
        run: |
          set -euo pipefail
          v="$(grep -A20 '^  deploymentTarget:' src/app/project.yml \
                | grep -vE '^[[:space:]]*#' \
                | grep -m1 -oE 'iOS: "[0-9.]+"' | grep -oE '[0-9.]+')"
          echo "app deployment floor: $v"
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: restore the guest image
        # Deliberately its own cache, and deliberately keyed on nothing but the
        # release asset: the image is a 1.1 GB fixed download, and folding it
        # into the cache key below -- which varies with Xcode version, the
        # deployment floor and the ANGLE patch -- would store one copy per
        # configuration. Everything derived from it goes in the cache below.
        uses: actions/cache@v4
        with:
          path: |
            build/lineage-vda.qcow2
            build/r8.jar
          key: husk-guest-image-${{ hashFiles('scripts/fetch_translation_resources.sh') }}

      - name: restore caches
        # Deliberately does NOT cache QEMU's meson build directory. The
        # dependency stages stamp themselves in build/stamps, so restoring that
        # with the sysroot skips libffi/glib/pixman/libslirp -- but the `qemu`
        # stamp lives in the same directory and would also skip the QEMU build,
        # whose output is in a directory we are not caching. That stamp is
        # removed on the next step. ANGLE, virglrenderer and MoltenVK need no
        # stamps: each checks for its own output in the cached sysroot and skips.
        uses: actions/cache@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['cache'] }}
        with:
          path: |
            third_party/sources
            build/stamps
            build/ios-arm64/sysroot
            build/ios-arm64/lib
            # Translation-layer resources: the unpacked system partition and
            # everything built from it. Re-unpacking is a multi-minute read of
            # 1.1 GB, and it is deterministic, so caching it is safe.
            build/system.img
            build/java-apex-root
            build/java-framework-files
            build/android-system
            build/java-runtime
          key: husk-macos-arm64-${{ inputs['xcode-version'] || github.event.inputs['xcode-version'] || '26.6' }}-${{ steps.floor.outputs.value }}-patch${{ inputs['clang15-patches'] == 'yes' && '1' || '0' }}${{ inputs['webkit-commit'] || 'main' }}-${{ hashFiles('scripts/sources.sh') }}

      - name: invalidate the QEMU stamp
        run: |
          set -euo pipefail
          if [ -f build/stamps/qemu ]; then
            echo "removing build/stamps/qemu: its build directory is not cached, so QEMU must rebuild"
            rm -f build/stamps/qemu
          fi

      - name: build
        # One entry point for the whole thing, in order: sources, the six QEMU
        # dependencies, ANGLE, virglrenderer, QEMU, the Husk patches into QEMU,
        # the guest image, MoltenVK, the Rust pairing library, then the app and
        # both packages. HUSK_CLANG15_PATCHES and WEBKIT_COMMIT come from the
        # job's env, above.
        run: ./scripts/ci_build.sh "$GITHUB_WORKSPACE/dist/Husk.ipa"

      - name: collect the outputs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          # ci_build.sh runs package_ipa.sh twice. ci_build.sh already wrote both
          # into build/; pick them up by name so the second is captured even if
          # the job died partway through producing it.
          find "$GITHUB_WORKSPACE/build" -maxdepth 1 -name 'Husk.*' \
            -exec cp -f {} dist/ \; 2>/dev/null || true
          ls -lh dist || echo "(no packages)"

      - name: upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-packages
          path: dist/
          if-no-files-found: warn
          retention-days: 14

      - name: upload build logs
        if: always()
        # The build scripts log to files rather than the console, so a failure is
        # otherwise just "[FAIL] qemu (see build/logs/qemu.log)".
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/logs/
            /tmp/husk_ipa/build.log
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------------------------- release
  release:
    name: attach packages to the release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Husk-packages
          path: packages

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
