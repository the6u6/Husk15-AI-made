name: build

# Husk's CI. Two jobs with very different costs:
#
#   validate  ~1 min, no dependencies. Runs on every PR. Checks the things that
#             have actually gone wrong in this repo: a source file missing from
#             the target, a deployment target drifting, a native library sitting
#             ABOVE the app (dyld then refuses to load it at launch).
#
#   build     Hours. Runs on push to main, on tags, and on demand. Needs no
#             signing identity: package_ipa.sh builds with CODE_SIGNING_ALLOWED=NO
#             and ad-hoc signs with Husk's entitlements, which TrollStore keeps
#             and a sideloader replaces.
#
# There is deliberately no PR trigger on `build`. A cold run fetches WebKit for
# ANGLE (~260 MB), builds QEMU, MoltenVK with SPIRV-Cross and SPIRV-Tools, and
# the Rust pairing library, then cross-compiles the app. That is not something to
# spend on every pull request.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runner-image:
        description: "GitHub-hosted runner image (must be Apple Silicon)"
        type: choice
        default: macos-15
        options: [macos-14, macos-15, macos-26]
      xcode-version:
        description: "Xcode version (the iOS SDK must be 26.0 or newer)"
        type: string
        default: latest-stable
      cache:
        description: "Use the dependency/QEMU caches"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- validate
  # Fast, dependency-free, and aimed squarely at this repo's recurring failures.
  # It needs an arm64 image only because both jobs live in this one file; it
  # touches no iOS SDK.
  validate:
    name: validate project and iOS 15 floor
    runs-on: macos-14
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: install xcodegen
        run: brew install xcodegen

      - name: regenerate the project from project.yml
        # project.yml is the source of truth; the checked-in .pbxproj is a build
        # artefact of it. Regenerating here is what package_ipa.sh does too, so a
        # stale artefact cannot pass review.
        run: cd src/app && xcodegen generate

      - name: assert every source file is in the target
        # The failure this guards is silent and confusing: a .swift file that
        # exists on disk but not in the target gives "cannot find 'X' in scope"
        # for a type that is plainly right there. project.yml globs the
        # directories, so a file is only absent when the checked-in .pbxproj is
        # out of date -- which is what happens whenever xcodegen is missing.
        run: |
          set -euo pipefail
          missing=0
          for f in src/app/Husk/*.swift src/app/Husk/Play/*.swift \
                   src/app/Shared/*.swift src/app/HuskDownloadsWidget/*.swift \
                   src/app/HuskJITHelper/*.swift; do
            base="$(basename "$f")"
            if ! grep -q "$base" src/app/Husk.xcodeproj/project.pbxproj; then
              echo "::error file=$f::not present in project.pbxproj; the target will not compile it"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "ok: every Swift source is in the target"

      - name: assert the deployment targets
        run: |
          set -euo pipefail
          # The app's floor is the `iOS:` line under the top-level
          # `deploymentTarget:` in `options:`. The extensions use a four-space
          # `deploymentTarget: "..."`, so anchoring on exactly two spaces cannot
          # pick one of theirs up.
          app="$(grep -A20 '^  deploymentTarget:' src/app/project.yml \
                 | grep -m1 -oE 'iOS: "[0-9.]+"' \
                 | grep -oE '[0-9.]+')"
          echo "app target floor: $app"
          if [ "$app" != "15.0" ]; then
            echo "::error::project.yml floor is '$app', expected 15.0"
            exit 1
          fi
          # The two extensions are meant to sit ABOVE the app and must stay
          # there: 26.0 for Built-in StikJIT's helper, 16.1 for Live Activities.
          grep -q 'deploymentTarget: "26.0"' src/app/project.yml \
            || { echo "::error::HuskJITHelper must keep its 26.0 floor"; exit 1; }
          grep -q 'deploymentTarget: "16.1"' src/app/project.yml \
            || { echo "::error::HuskDownloadsWidget must keep its 16.1 floor"; exit 1; }
          if ! grep -q "IPHONEOS_DEPLOYMENT_TARGET = $app;" src/app/Husk.xcodeproj/project.pbxproj; then
            echo "::warning::the checked-in .pbxproj does not match project.yml. package_ipa.sh regenerates it when xcodegen is installed, so this is a warning rather than a failure."
          fi
          echo "ok: floors agree"

      - name: assert no embedded native sits above the app
        # dyld refuses to load a dylib whose LC_BUILD_VERSION minos exceeds the
        # running OS. An ANGLE or QEMU built above the app's floor is a silent
        # launch-time failure, invisible until someone runs the IPA on the
        # oldest supported version. This is the most breakable invariant in the
        # iOS 15 port, so it is a build-time check.
        run: |
          set -euo pipefail
          bad=0
          check() {
            if grep -qE "$2" "$1"; then
              echo "::error file=$1::$3 is above the app's 15.0 floor"
              bad=1
            fi
          }
          check scripts/build_ios.sh            'SDKMINVER:-15\.[1-9]'            "QEMU SDKMINVER"
          check scripts/build_angle_ios.sh      'IPHONEOS_DEPLOYMENT_TARGET="15\.[1-9]' "ANGLE"
          check scripts/build_rppairing_ios.sh  'IPHONEOS_DEPLOYMENT_TARGET=15\.[1-9]'    "rppairing"
          if [ "$bad" -ne 0 ]; then
            echo "raise them together with project.yml, or not at all"
            exit 1
          fi
          echo "ok: QEMU, ANGLE and rppairing are all at or below 15.0"

      - name: assert no iOS 16/17-only API crept back in
        # The app deploys to 15.0 and Compat15.swift is the only file allowed to
        # name these. Anything else fails to compile; catching it here gives a
        # readable message instead of an availability error inside Xcode.
        run: |
          set -euo pipefail
          pat='NavigationStack|NavigationLink\(value:|navigationDestination|NavigationView\(path:|ShareLink\(item:|\.presentationDetents|\.presentationDragIndicator|persistentSystemOverlays|\.snappy\b|\.animation\(.+, value:|\.toolbar\(\.(hidden|visible), for:|\bLabeledContent\b'
          hits="$(grep -rnE "$pat" src/app --include='*.swift' --exclude=Compat15.swift \
                   | grep -vE '^[^:]+:[0-9]+: *//' || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::iOS 16/17-only API used outside Compat15.swift; use the shim instead"
            exit 1
          fi
          echo "ok: no iOS 16/17-only APIs outside the shim"

  # ------------------------------------------------------------------- build
  build:
    name: build IPA and tipa
    runs-on: ${{ inputs['runner-image'] || github.event.inputs['runner-image'] || 'macos-15' }}
    # 6 hours is the hard ceiling on a macOS runner. A cold build is long but
    # comfortably inside it; raise this only if the cache is being ignored.
    timeout-minutes: 355
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # package_ipa.sh stamps the commit into the bundle

      - name: select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs['xcode-version'] || github.event.inputs['xcode-version'] || 'latest-stable' }}

      - name: preflight
        run: |
          set -euo pipefail
          echo "== runner ==";  uname -m; sw_vers
          echo "== xcode ==";   xcodebuild -version
          echo "== sdks ==";    xcodebuild -showsdks | grep -i iphoneos || true
          echo "== host ==";    python3 --version; git --version
          echo "== disk ==";    df -h /

          # scripts/build_gpu_ios.sh hardcodes /opt/homebrew/bin/{meson,ninja},
          # which is the Apple Silicon Homebrew prefix. An Intel runner has no
          # such path and the job fails deep inside a meson error.
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::not an Apple Silicon runner; build_gpu_ios.sh needs arm64 Homebrew at /opt/homebrew"
            exit 1
          fi

          # HuskJITHelper's deployment target is 26.0, and Xcode refuses a
          # deployment target above the installed SDK. Fail here, with the
          # reason, rather than with an opaque error 2000 lines into a build log.
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK: $sdk"
          major="${sdk%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "::error::iOS SDK $sdk is too old. HuskJITHelper has a 26.0 deployment target (Built-in StikJIT). Re-run with workflow_dispatch and an Xcode that ships an iOS 26+ SDK."
            exit 1
          fi

          free_gb="$(df -g / | awk 'NR==2 {print $4}')"
          if [ "${free_gb:-0}" -lt 30 ]; then
            echo "::warning::only ${free_gb}GB free on /. A cold build writes WebKit, QEMU, MoltenVK and DerivedData."
          fi

      - name: install build tools
        run: |
          set -euo pipefail
          # meson and ninja for the QEMU and virglrenderer cross builds,
          # pkg-config for their .pc files, xcodegen to regenerate the project
          # from project.yml, and qemu purely for qemu-img, which the app
          # target's pre-build phase calls to create the two blank disk seeds.
          brew install meson ninja pkg-config xcodegen qemu

      - name: install the Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios
          rustc --version

      - name: restore caches
        # Deliberately does NOT cache QEMU's meson build directory. The
        # dependency stages stamp themselves in build/stamps, so restoring that
        # with the sysroot skips libffi/glib/pixman/libslirp -- but the `qemu`
        # stamp lives in the same directory and would also skip the QEMU build,
        # whose output is in a directory we are not caching. That stamp is
        # removed on the next step. ANGLE, virglrenderer and MoltenVK need no
        # stamps: each checks for its own output in the cached sysroot and skips.
        uses: actions/cache@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['cache'] }}
        with:
          path: |
            third_party/sources
            build/stamps
            build/ios-arm64/sysroot
            build/ios-arm64/lib
            guests/phase0
          key: husk-macos-arm64-${{ inputs['xcode-version'] || github.event.inputs['xcode-version'] || 'latest-stable' }}-15.0-${{ hashFiles('scripts/sources.sh') }}

      - name: invalidate the QEMU stamp
        run: |
          set -euo pipefail
          if [ -f build/stamps/qemu ]; then
            echo "removing build/stamps/qemu: its build directory is not cached, so QEMU must rebuild"
            rm -f build/stamps/qemu
          fi

      - name: build
        # One entry point for the whole thing, in order: sources, the six QEMU
        # dependencies, ANGLE, virglrenderer, QEMU, the Husk patches into QEMU,
        # the guest image, MoltenVK, the Rust pairing library, then the app and
        # both packages.
        run: ./scripts/ci_build.sh "$GITHUB_WORKSPACE/dist/Husk.ipa"

      - name: collect the outputs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          # ci_build.sh runs package_ipa.sh twice. ci_build.sh already wrote both
          # into build/; pick them up by name so the second is captured even if
          # the job died partway through producing it.
          find "$GITHUB_WORKSPACE/build" -maxdepth 1 -name 'Husk.*' \
            -exec cp -f {} dist/ \; 2>/dev/null || true
          ls -lh dist || echo "(no packages)"

      - name: upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-packages
          path: dist/
          if-no-files-found: warn
          retention-days: 14

      - name: upload build logs
        if: always()
        # The build scripts log to files rather than the console, so a failure is
        # otherwise just "[FAIL] qemu (see build/logs/qemu.log)".
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/logs/
            /tmp/husk_ipa/build.log
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------------------------- release
  release:
    name: attach packages to the release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Husk-packages
          path: packages

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
