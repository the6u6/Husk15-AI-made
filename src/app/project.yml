name: Husk
options:
  # xcode15_3 -> objectVersion 63. XcodeGen's default is xcode16_0, which emits
  # objectVersion 77 and a preferredProjectObjectVersion attribute; Xcode 15.4
  # cannot open that at all:
  #
  #   Unable to read project 'Husk.xcodeproj' ... it is in a future Xcode project
  #   file format (77). Adjust the project format using a compatible version.
  #
  # This is unconditional rather than tied to the iOS 14 experiment, because it
  # is strictly the more portable choice: Xcode 26 opens an objectVersion 63
  # project without complaint, while a 77 project is only readable by Xcode 16+.
  # The one spec feature gated on xcode16_0 is `syncedFolder`, and this spec does
  # not use it -- every source below is a plain group or folder.
  #
  # The checked-in Husk.xcodeproj/project.pbxproj is a build artefact and still
  # says 77 until someone runs `xcodegen generate`. package_ipa.sh does that
  # automatically when xcodegen is installed, which is what CI does.
  projectFormat: xcode15_3
  bundleIdPrefix: com.husk
  deploymentTarget:
    # EXPERIMENTAL iOS 14 floor. Not proven to build; see IOS14-EXPERIMENT.md.
    #
    # The working configuration is 15.0. To go back, put iOS: "15.0" here, put
    # 15.0 back into the three build scripts, and restore the HuskJITHelper
    # target and the Embed StikJIT phase -- all of which IOS14-EXPERIMENT.md
    # lists with the exact text.
    #
    # 14.0 forces Xcode 15.x, not 16: Xcode 16 already raised the minimum
    # deployment target to iOS 15, so only 15.x (iOS 17.5 SDK, floor iOS 12)
    # can express this. Xcode 15.4 runs on macOS Sonoma 14.x only, which on
    # GitHub means the macos-14 image -- fully unsupported from 2026-11-02.
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # The app and its JIT helper extension follow this together: the helper's
    # identifier has to sit under the app's. Change this, not
    # PRODUCT_BUNDLE_IDENTIFIER.
    HUSK_BUNDLE_IDENTIFIER: com.husk.app
    # The app's entitlements only. A signed development build has to drop
    # dynamic-codesigning, which Apple will not provision; overriding this
    # rather than CODE_SIGN_ENTITLEMENTS keeps the override off the helper.
    HUSK_ENTITLEMENTS: Husk/Husk.entitlements
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_BITCODE: NO
    SWIFT_VERSION: "5.0"
    # The JIT path is timing-sensitive and the display loop is latency-sensitive;
    # never let a debug build of either mislead us. This outlived the guest
    # framebuffer the first half of that sentence was about.
    SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Husk:
    type: application
    platform: iOS
    sources:
      - path: Husk
        excludes:
          - "Resources/**"
      # NOT `type: folder`: a folder reference copies the directory itself into the
      # bundle, and Bundle.path(forResource:ofType:) does not search subdirectories,
      # so the script would be present but unfindable at runtime.
      - path: Husk/Resources
        buildPhase: resources
      # The experimental translation layer's C side. Compiled into the app,
      # not into the QEMU library -- see docs/04-translation-layer.md.
      - path: ../translation-layer
      # The native runtime: a real linker for Android's libraries, a bionic shim, JNI with a
      # Java world written in C, and the Unity and cocos2d-x drivers. Runs Unity games such as Subway Surfers
      # and cocos2d-x games such as Geometry Dash.
      - path: ../translation-layer-next
        excludes:
          - "husk-tl-unity-app.h"
      # The messages the app and its JIT helper exchange.
      - path: HuskJITHelper/HuskJITMessages.swift
      # The download Live Activity's attributes, shared with the widget that draws it.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HUSK_BUNDLE_IDENTIFIER)
        # Set your team here rather than in Xcode's UI: this file is the source of
        # truth, and `xcodegen generate` overwrites Husk.xcodeproj.
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        # The icon lives in Assets.xcassets/AppIcon.appiconset. Without this
        # the catalog is compiled and the icon is never referenced.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternates, so the icon can be chosen in Settings. iOS can only switch
        # between NAMED icons, which is why each appearance variant is its own
        # appiconset rather than appearances inside one.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconClearLight AppIconClearDark AppIconTintedLight AppIconTintedDark
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Husk/Info.plist
        CODE_SIGN_ENTITLEMENTS: "$(HUSK_ENTITLEMENTS)"
        SWIFT_OBJC_BRIDGING_HEADER: Husk/HuskBridge.h
        # ANGLE is dlopened by @rpath at GL start-up, and is embedded but not
        # linked, so this is what makes the loader find it.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        # Husk targets iPhones and iPads (iPadOS).
        TARGETED_DEVICE_FAMILY: "1,2"
        # XcodeGen links the dylib by -l, so the linker needs a library search
        # path (not just the framework search path it infers from the file).
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../build/ios-arm64/lib"
          - "$(SRCROOT)/Frameworks"
        # zlib, for the translation layer's APK reader. Part of the iOS SDK. AudioToolbox is the sound a
        # cocos2d-x game's mixer plays through; CoreText and CoreGraphics draw its text labels.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lz"
          # libresolv: the phone's DNS servers, for games that resolve names themselves (Geode's c-ares).
          - "-lresolv"
          # SQLite for Java apps' android.database.sqlite (the system's own library).
          - "-lsqlite3"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "CoreText"
          - "-framework"
          - "CoreGraphics"
          # ImageIO decodes and encodes images for Java apps' BitmapFactory and Bitmap.compress.
          - "-framework"
          - "ImageIO"
          # WebKit draws Java apps' android.webkit.WebView (WKWebView under the app's screen).
          - "-framework"
          - "WebKit"
          # VideoToolbox (with CoreMedia and CoreVideo) decodes H.264/HEVC for Java apps' MediaCodec; Accelerate converts the frames.
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreVideo"
          - "-framework"
          - "Accelerate"
          # Security verifies the licence signature Minecraft's UI engine checks through Java's Signature class.
          - "-framework"
          - "Security"
          # On-device pairing for Built-in StikJIT, built by scripts/build_rppairing_ios.sh.
          - "-lhusk_rppairing"
    dependencies:
      # The download Live Activity (Lock Screen and Dynamic Island). Embedded into PlugIns/.
      # 16.1, which the iOS 17.5 SDK still accepts, so it survives a 14.0 floor
      # and simply never loads below 16.1.
      - target: HuskDownloadsWidget
      # REMOVED (VM removal): the libqemu-aarch64-softmmu.dylib dependency.
      # Husk no longer runs a full Android system; the translation layer is a
      # separate C runtime and needs no QEMU. The LD_RUNPATH entry above stays:
      # ANGLE and MoltenVK are also @rpath-loaded from Frameworks/.
      # The file picker's Open button does nothing on certificate-signed installs; this tweak (from issue #60) hooks
      # UIDocumentPickerViewController so the picker hands over copies. Linked so it loads at launch.
      - framework: Frameworks/libFilePickerFix.dylib
        embed: true
        codeSign: true
      # ANGLE, which the translation layer dlopens by @rpath at GL start-up.
      # Embedded but NOT linked: nothing in the app references its symbols
      # directly, and the only thing that would notice its absence is the
      # dynamic loader -- which is exactly what happened.
      #
      # This was in the checked-in .pbxproj and missing here, which nobody could
      # see while the project was never regenerated. The first regeneration
      # dropped it and the app died at bring-up with "Couldn't open
      # @rpath/libANGLE-shared.dylib". The loader that hit that was QEMU's; it
      # is now husk-tl-egl's, so the same mistake is still fatal, just from a
      # different place.
      - framework: ../../build/ios-arm64/sysroot/lib/libANGLE-shared.dylib
        embed: true
        codeSign: true
        link: false
      # MoltenVK, which Unreal Engine's Vulkan renderer runs on (Minecraft Dungeons). Built from
      # KhronosGroup/MoltenVK v1.4.2 with `make ios` (third_party/build/MoltenVK-1.4.2) and copied to
      # build/ios-arm64/lib. Embedded, not linked: the native runtime opens it by path when an Unreal game starts.
      - framework: ../../build/ios-arm64/lib/MoltenVK.xcframework
        embed: true
        codeSign: true
        link: false

    # REMOVED (VM removal): the "Stage guest image" preBuildScript. It copied
    # the Phase 0 kernel and initramfs, the QEMU option ROMs, the UEFI firmware
    # and two qcow2 seeds into the bundle, and needed qemu-img at build time.
    # All of it existed to boot the VM. The app is now a SwiftUI shell over the
    # translation layer, which loads no guest.


    # EXPERIMENTAL (VM removal): most of the "Stage guest image" preBuildScript.
    # It copied the Phase 0 kernel and initramfs, the QEMU option ROMs, the UEFI
    # firmware and two qcow2 seeds into the bundle, and needed qemu-img at build
    # time. All of it existed to boot the VM, and the app is now a SwiftUI shell
    # over the translation layer, which loads no guest.
    #
    # KEPT, because upstream added them to the same script and they have nothing
    # to do with QEMU: Android's CA certificates and fonts for Flutter, and
    # Husk's Dalvik runtime for Java apps. Dropping them with the VM would break
    # exactly those apps. outputFiles went with the dropped half -- every entry
    # named a VM artefact.
    preBuildScripts:
      - name: Stage translation-layer resources
        script: |
          set -e
          mkdir -p "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"

          # The parts of Android's /system that apps on the translation layer read directly: CA certificates and
          # fonts (scripts/build_android_system.sh makes them from the Lineage image). Flutter apps need both.
          SYS="$SRCROOT/../../build/android-system"
          if [ -d "$SYS/fonts" ]; then
            rsync -a --delete "$SYS/" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/android-system/"
          else
            echo "warning: build/android-system missing (scripts/build_android_system.sh): Flutter apps will have no system fonts" >&2
          fi

          # Husk's Dalvik runtime for Java apps (libGDX games and the like): libcore, ICU and Husk's Java framework
          # (scripts/build_java_runtime.sh). ELF libraries and jars, so resources, not code the app links.
          JRT="$SRCROOT/../../build/java-runtime"
          if [ -f "$JRT/husk-framework.dex" ]; then
            rsync -a --delete "$JRT/" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/java-runtime/"
          else
            echo "warning: build/java-runtime missing (scripts/build_java_runtime.sh): Java apps will not start" >&2
          fi
        # Every build: the Java runtime this copies changes without Xcode knowing -- the
        # phase has outputs and no inputs, so dependency analysis skips it once the
        # outputs exist, and the IPA carries a day-old runtime (upstream build 102).
        basedOnDependencyAnalysis: false

    # EXPERIMENTAL (iOS 14): postBuildScripts and the HuskJITHelper target are
    # gone. Xcode refuses a deployment target above the installed SDK, so the
    # helper's 26.0 cannot be built on the iOS 17.5 SDK that an iOS 14 floor
    # forces -- no Xcode ships both. Nothing else links StikJIT.framework, so the
    # "Embed StikJIT" phase went with it; leaving it would put a framework
    # carrying MinimumOSVersion 17.4 inside a 14.0 app.
    #
    # Both blocks are reproduced verbatim in IOS14-EXPERIMENT.md for the revert.

  # Draws the Live Activity a download shows (Downloads.swift starts and updates it). Live Activities are iOS 16.1.
  HuskDownloadsWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: HuskDownloadsWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HUSK_BUNDLE_IDENTIFIER).Downloads
        INFOPLIST_FILE: HuskDownloadsWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
